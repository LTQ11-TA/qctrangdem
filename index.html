<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosy - Bắt dê đón Tết</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    /* Ảnh chụp trang báo làm nền */
    .page-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #fff;
    }

    .page-background img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    /* Banner bên phải */
    .right-banner {
      position: fixed;
      z-index: 2;
      top: 65.49%;
      right: 7%;
      width: clamp(180px, 24vw, 470px);
      aspect-ratio: 937 / 781;
      display: block;
      transform: translateY(-50%);
      overflow: hidden;
      cursor: pointer;
    }

    .right-banner img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .right-banner:focus-visible {
      outline: 3px solid #111;
      outline-offset: 4px;
    }

    /* Điện thoại */
    @media (max-width: 700px) {
      .right-banner {
        top: auto;
        right: 4%;
        bottom: 3%;
        width: clamp(150px, 52vw, 300px);
        transform: none;
      }
    }

    /* Màn hình ngang thấp */
    @media (max-height: 500px) and (orientation: landscape) {
      .right-banner {
        top: 50%;
        right: 3%;
        bottom: auto;
        width: auto;
        height: 88vh;
        aspect-ratio: 937 / 781;
        transform: translateY(-50%);
      }
    }
  </style>
</head>

<body>
  <!-- Ảnh nền trang báo -->
  <picture class="page-background">
    <source
      media="(max-width: 700px)"
      srcset="nen dth chinh.png"
    >

    <img
      src="background-desktop.png"
      alt="Trang báo Tuổi Trẻ"
    >
  </picture>

  <!-- Bấm vào banner để mở game.html -->
  <a
    class="right-banner"
    href="game.html"
    aria-label="Khám phá trò chơi Bắt dê đón Tết"
  >
    <img
      src="right banner.png"
      alt="Bắt dê đón Tết, Cosy gắn kết"
    >
  </a>
</body>
</html>
