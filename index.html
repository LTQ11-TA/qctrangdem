<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cosy - Bắt dê đón Tết</title>

  <style>
    /*
      NGUYÊN TẮC: banner luôn bám theo ẢNH NỀN, không bám theo cửa sổ.

      --ratio   = rộng / cao của ảnh nền (JS ở cuối file tự đọc từ ảnh thật)
      --stage-w = chiều rộng ảnh nền khi hiển thị
                  = vừa chiều rộng màn hình (100vw); nếu màn hình quá "lùn" thì
                    phóng to thêm để lấp đầy chiều cao, nhưng tối đa 112vw để
                    khung quảng cáo không bao giờ bị cắt khỏi màn hình.
      --stage-x = khoảng cách từ mép trái màn hình tới mép trái ảnh nền (canh giữa)

      Banner được đặt bằng % của --stage-w nên luôn đè khít khung quảng cáo trong ảnh.
    */
    :root {
      --ratio: 1.9015; /* 5925 / 3116, ảnh desktop */

      --stage-w: clamp(100vw, calc(100vh * var(--ratio)), 112vw);
      --stage-x: calc((100vw - var(--stage-w)) / 2);

      /* Vị trí khung quảng cáo trong ảnh nền desktop (đã đo trên ảnh thật 5925x3116:
         khung rộng 1418px, cao 1181px, cách trái 4117px, cách trên 1443px).
         Đơn vị: 1 = 100% chiều rộng ảnh nền. Đã nới ~2px mỗi cạnh để không lộ viền. */
      --ad-left: 0.69385;
      --ad-top: 0.24264;
      --ad-width: 0.24132;
    }

    @supports (height: 100dvh) {
      :root {
        --stage-w: clamp(100vw, calc(100dvh * var(--ratio)), 112vw);
      }
    }

    /* Điện thoại (màn hình hẹp, đang cầm dọc): dùng ảnh nền mobile (2588 x 5600).
       Khung quảng cáo đỏ nằm giữa ảnh: rộng 1906px, cao 1589px,
       cách trái 358px, cách trên 1260px. Đã nới ~2px mỗi cạnh. */
    @media (max-width: 700px) and (orientation: portrait) {
      :root {
        --ratio: 0.4621;
        --ad-left: 0.13733;
        --ad-top: 0.48608;
        --ad-width: 0.73848;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    /* Ảnh chụp trang báo làm nền */
    .page-background {
      position: fixed;
      z-index: 0;
      top: 0;
      left: var(--stage-x);
      width: var(--stage-w);
      display: block;
    }

    .page-background img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Banner thật để bấm: đè khít lên khung quảng cáo trong ảnh nền */
    .right-banner {
      position: fixed;
      z-index: 2;
      left: calc(var(--stage-x) + var(--stage-w) * var(--ad-left));
      top: calc(var(--stage-w) * var(--ad-top));
      width: calc(var(--stage-w) * var(--ad-width));
      aspect-ratio: 937 / 781;
      display: block;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .right-banner img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .right-banner:focus-visible {
      outline: 3px solid #111;
      outline-offset: 4px;
    }

  </style>
</head>

<body>
  <!-- Ảnh nền trang báo -->
  <picture class="page-background">
    <!-- Điện thoại cầm dọc dùng ảnh nền mobile; điều kiện phải khớp với @media ở phần CSS -->
    <source
      media="(max-width: 700px) and (orientation: portrait)"
      srcset="background-mobile.png"
    >

    <img
      id="bg"
      src="background-desktop.png"
      alt="Trang báo Tuổi Trẻ"
    >
  </picture>

  <!-- Bấm vào banner để mở game.html -->
  <a
    class="right-banner"
    href="game.html"
    aria-label="Khám phá trò chơi Bắt dê đón Tết"
  >
    <img
      src="right%20banner.png"
      alt="Bắt dê đón Tết, Cosy gắn kết"
    >
  </a>

  <script>
    // Đọc tỉ lệ thật của ảnh nền đang hiển thị (desktop hoặc mobile) để banner luôn khớp.
    (function () {
      var bg = document.getElementById('bg');
      var root = document.documentElement;

      function syncRatio() {
        if (bg.naturalWidth && bg.naturalHeight) {
          root.style.setProperty('--ratio', (bg.naturalWidth / bg.naturalHeight).toFixed(5));
        }
      }

      bg.addEventListener('load', syncRatio);   // chạy lại cả khi <picture> đổi sang ảnh khác
      window.addEventListener('resize', syncRatio);
      window.addEventListener('orientationchange', syncRatio);
      if (bg.complete) syncRatio();
    })();
  </script>
</body>
</html>
